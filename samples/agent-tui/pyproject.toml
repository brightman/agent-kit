[project]
name = "agent-tui-sample"
version = "0.1.0"
description = "agent-kit sample — Textual TUI driving an Agent with skill-creator + WebSearch MCP, showing live event stream."
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "agent-kit[litellm]",
    "textual>=0.50",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
