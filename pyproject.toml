[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-kit"
version = "0.0.0"
description = "Minimal agent loop + skill + MCP toolkit"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "agent-kit contributors" },
]
dependencies = [
    # MCP: 直接依赖 Anthropic 官方 SDK,与 baizhi-agent PR f6 对齐
    "mcp>=1.0",
    # SKILL.md frontmatter 解析
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
litellm = ["litellm>=1.40"]
# `sandbox` extra is reserved for future runners (SRT, MCP-sandbox) that may
# need extra deps. LocalDirRunner (Stage C) is stdlib-only, so this list is
# empty for now — `pip install agent-kit[sandbox]` is forward-compatible.
sandbox = []
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "python-pptx>=1.0.2",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["agent_kit"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: tests that call real external LLM/MCP services and may spend quota",
]
